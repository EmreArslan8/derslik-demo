<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Derslik — yapay zekâ destekli çalışma alanı</title>
  <meta name="description" content="Öğrenciler için yapay zekâ araçlarıyla (Gemini, ChatGPT, Claude) uyumlu çalışma alanı. Demo / MVP." />
  <meta name="theme-color" content="#ECEAE4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span class="field f1"></span><span class="field f2"></span><span class="field f3"></span></div>

  <div class="shell">
    <aside class="rail glass">
      <a href="#/" class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3.5" y="6.5" width="25" height="17" rx="2" fill="none" stroke="currentColor"/><path d="M8 12h9M8 16h13" stroke="currentColor" stroke-linecap="round"/><path d="M11 23.5 9 28M21 23.5l2 4.5" stroke="currentColor" stroke-linecap="round"/><circle cx="24" cy="12" r="1.6" fill="var(--accent)"/></svg>
        <span>Derslik</span>
      </a>
      <nav class="nav" id="railNav" aria-label="Ana menü"></nav>
      <div class="rail-foot">
        <label class="model-pick" title="Kullanılacak yapay zekâ sağlayıcısı">
          <span class="mono">Model</span>
          <select id="provider"></select>
        </label>
        <div class="me" id="meCard"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <a href="#/" class="brand brand-m">Derslik</a>
        <button class="search" id="searchBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg><span>Ders, konu veya soru ara…</span><kbd class="mono">⌘K</kbd></button>
        <button class="focus-pill" id="focusPill" hidden></button>
        <div class="top-actions">
          <button class="ib" id="themeBtn" aria-label="Temayı değiştir"></button>
          <div class="pop-wrap">
            <button class="ib" id="bellBtn" aria-label="Bildirimler"></button>
            <div class="glass pop" id="notifs" hidden></div>
          </div>
          <span id="topAv" class="top-av"></span>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <nav class="tabbar glass" id="tabbar" aria-label="Alt menü"></nav>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-body glass">
      <span class="grab"></span>
      <div class="sheet-grid"></div>
    </div>
  </div>

  <div class="palette" id="palette" hidden>
    <div class="pal glass" role="dialog" aria-label="Arama">
      <div class="pal-in"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg><input placeholder="Sayfa, ders, konu… ya da asistana sor" /></div>
      <ul class="pal-list"></ul>
      <div class="pal-foot mono"><span>↑↓ gez</span><span>↵ aç</span><span>esc kapat</span></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views/panel.js"></script>
  <script src="js/views/courses.js"></script>
  <script src="js/views/assistant.js"></script>
  <script src="js/views/solve.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/rooms.js"></script>
  <script>UI.buildShell(); UI.Router.go();</script>
</body>
</html>
